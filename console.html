<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pinterest Scraper 控制台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #00ff00; overflow: hidden; }
        .header { background: #1a1a2e; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00ff00; }
        .header h1 { font-size: 16px; }
        .status { padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.running { background: #003300; color: #00ff00; }
        .status.stopped { background: #330000; color: #ff4444; }
        .main { display: flex; height: calc(100vh - 50px); }
        .left { width: 300px; background: #16213e; border-right: 1px solid #00ff00; overflow-y: auto; }
        .right { flex: 1; display: flex; flex-direction: column; }
        .panel { padding: 15px; border-bottom: 1px solid #00ff00; }
        .panel h3 { font-size: 13px; color: #00cc00; margin-bottom: 10px; }
        .log-line { font-size: 11px; padding: 2px 0; border-left: 2px solid #003300; padding-left: 8px; margin: 2px 0; }
        .log-info { border-color: #00cc00; color: #00cc00; }
        .log-error { border-color: #ff0000; color: #ff6666; }
        .form-group { margin: 8px 0; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 6px; background: #0a0a1a; border: 1px solid #00ff00; color: #00ff00; font-size: 12px; }
        button { padding: 8px 16px; background: #00cc00; color: #000; border: none; cursor: pointer; font-weight: bold; margin: 4px; }
        button:hover { background: #00ff00; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        .metric { background: #16213e; padding: 12px; border: 1px solid #00ff00; text-align: center; }
        .metric .value { font-size: 24px; font-weight: bold; color: #00ff00; }
        .metric .label { font-size: 11px; color: #888; margin-top: 4px; }
        #log-container { flex: 1; overflow-y: auto; padding: 10px; font-size: 11px; }
        #log-container::-webkit-scrollbar { width: 4px; }
        #log-container::-webkit-scrollbar-track { background: #0a0a0a; }
        #log-container::-webkit-scrollbar-thumb { background: #00ff00; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Pinterest Scraper 控制台</h1>
        <div>
            <span class="status" id="serviceStatus">状态: 未启动</span>
        </div>
    </div>
    <div class="main">
        <div class="left">
            <div class="panel">
                <h3>📝 运行配置</h3>
                <div class="form-group">
                    <label>查询关键词</label>
                    <input type="text" id="queryInput" value="简约风格">
                </div>
                <div class="form-group">
                    <label>最大数量</label>
                    <input type="number" id="maxPinsInput" value="50">
                </div>
                <div class="form-group">
                    <label>最小 Saves</label>
                    <input type="number" id="minSavesInput" value="100">
                </div>
                <div class="form-group">
                    <label>最小 Likes</label>
                    <input type="number" id="minLikesInput" value="50">
                </div>
                <div class="form-group">
                    <label>最小 Comments</label>
                    <input type="number" id="minCommentsInput" value="10">
                </div>
                <button onclick="startScrape()" id="startBtn">🚀 开始爬取</button>
                <button onclick="stopScrape()" id="stopBtn" disabled>⏹ 停止</button>
            </div>
            <div class="panel">
                <h3>📊 实时指标</h3>
                <div class="metrics">
                    <div class="metric"><div class="value" id="metricPins">0</div><div class="label">已获取</div></div>
                    <div class="metric"><div class="value" id="metricStatus">-</div><div class="label">状态</div></div>
                    <div class="metric"><div class="value" id="metricTime">-</div><div class="label">耗时(s)</div></div>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="panel" style="flex: 1;">
                <h3>📋 实时日志</h3>
                <div id="log-container"></div>
            </div>
        </div>
    </div>
    <script>
        let ws = null;
        let isRunning = false;
        let startTime = null;
        
        function connectWS() {
            ws = new WebSocket('ws://localhost:8000/ws');
            ws.onopen = () => log('WebSocket 连接成功', 'info');
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'log') {
                    log(data.message, data.level || 'info');
                }
                if (data.type === 'status') {
                    document.getElementById('serviceStatus').className = 'status ' + (data.running ? 'running' : 'stopped');
                    document.getElementById('serviceStatus').textContent = '状态: ' + (data.running ? '运行中' : '已停止');
                    document.getElementById('metricPins').textContent = data.pins || 0;
                    document.getElementById('metricStatus').textContent = data.status || '-';
                    if (data.time) document.getElementById('metricTime').textContent = data.time;
                }
            };
            ws.onclose = () => { if (isRunning) setTimeout(connectWS, 1000); };
        }
        
        function log(msg, level) {
            const div = document.createElement('div');
            div.className = 'log-line log-' + (level || 'info');
            div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            document.getElementById('log-container').appendChild(div);
            document.getElementById('log-container').scrollTop = document.getElementById('log-container').scrollHeight;
        }
        
        async function startScrape() {
            if (isRunning) return;
            isRunning = true;
            startTime = Date.now();
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            const data = {
                query: document.getElementById('queryInput').value,
                max_pins: parseInt(document.getElementById('maxPinsInput').value),
                min_saves: parseInt(document.getElementById('minSavesInput').value),
                min_likes: parseInt(document.getElementById('minLikesInput').value),
                min_comments: parseInt(document.getElementById('minCommentsInput').value)
            };
            
            try {
                const resp = await fetch('http://localhost:8000/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await resp.json();
                log(JSON.stringify(result, null, 2), result.success ? 'info' : 'error');
            } catch (e) {
                log('请求失败: ' + e.message, 'error');
            } finally {
                isRunning = false;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            }
        }
        
        function stopScrape() {
            // 通过发送请求到停止端点来停止
            fetch('http://localhost:8000/api/stop').catch(() => {});
        }
        
        // 启动
        connectWS();
        // 每秒发送心跳保持连接
        setInterval(() => {
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 5000);
    </script>
</body>
</html>
